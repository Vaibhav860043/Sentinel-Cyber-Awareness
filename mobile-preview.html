<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08100e">
<title>Sentinel - Mobile Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08100e;color:#eef5ef;font:14px/1.5 Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.preview{width:min(100%,460px);text-align:center}.preview h1{font-size:20px;margin:0 0 6px}.preview p{color:#a4b4a8;margin:0 0 15px}.phone{margin:auto;width:430px;max-width:100%;height:min(900px,82vh);min-height:560px;border:8px solid #29362e;border-radius:32px;background:#000;box-shadow:0 24px 70px #0009;overflow:hidden;position:relative}.notch{position:absolute;z-index:2;top:0;left:50%;transform:translateX(-50%);width:120px;height:17px;background:#29362e;border-radius:0 0 12px 12px}.phone iframe{border:0;background:#08100e;width:100%;height:100%;display:block}.actions{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:14px}.actions a{color:#c5fa83;text-decoration:none}.actions a:hover{text-decoration:underline}@media(max-width:520px){body{padding:16px}.preview{width:100%}.preview h1{font-size:18px}.phone{width:100%;height:80vh;min-height:500px;border-width:6px;border-radius:26px}}
</style>
</head>
<body>
<main class="preview">
  <h1>Sentinel - phone preview</h1>
  <p>This frame shows the responsive website at a phone-sized width.</p>
  <div class="phone"><div class="notch" aria-hidden="true"></div><iframe src="index-en.html" title="Sentinel cybersecurity awareness website, mobile preview"></iframe></div>
  <nav class="actions" aria-label="Website links"><a href="index-en.html">Open full website</a><a href="Sentinel-Cyber-Safety-Website.pdf">Read the phone-friendly PDF</a></nav>
</main>
</body>
</html>
